[project]
name = "mach"
version = "0.0.1"
description = "M.A.C.H.: revision-safe, citation-grounded multimodal RAG for shop-floor SOPs and work instructions"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  # core
  "pydantic>=2",
  "pyyaml",
  "structlog",
  "pint",
  # parsing
  "docling",
  "pymupdf",
  "pillow",
  "opencv-python-headless",
  # retrieval
  "rank-bm25",
  "FlagEmbedding",
  "sentence-transformers",
  "colpali-engine",
  "qdrant-client",
  # generation / agents
  "openai",            # vLLM OpenAI-compatible client
  "langgraph",
  # storage
  "sqlalchemy>=2",
  "alembic",
  "psycopg[binary]",
  # api / ui
  "fastapi",
  "uvicorn[standard]",
  "streamlit",
  # security
  "presidio-analyzer",
  "presidio-anonymizer",
]

[project.optional-dependencies]
train = ["transformers", "datasets", "peft", "accelerate", "scikit-learn"]
eval = ["ragas", "pandas", "numpy", "scipy", "statsmodels", "evaluate"]
cloud = ["google-genai", "google-cloud-aiplatform"]
dev = ["pytest", "pytest-xdist", "ruff", "mypy", "pre-commit"]
# vLLM is installed inside WSL2/Docker, not in the Windows venv.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mach"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests", "eval/edge_cases"]
