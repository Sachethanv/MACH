# Skeleton. Edge-first: everything on one plant-side GPU box.
services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: mach, POSTGRES_PASSWORD: mach, POSTGRES_DB: mach}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes: ["qdrant_storage:/qdrant/storage"]
  vllm:
    image: vllm/vllm-openai
    command: ["--model", "Qwen/Qwen2.5-VL-7B-Instruct-AWQ", "--max-model-len", "16384", "--gpu-memory-utilization", "0.6"]
    environment: {HF_TOKEN: "${HF_TOKEN}"}
    ports: ["8000:8000"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    profiles: ["gpu"]
  # api: build from docker/ (TODO)
  # ui:  build from docker/ (TODO)
volumes:
  pgdata:
  qdrant_storage:
