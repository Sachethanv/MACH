<svg viewbox="0 0 760 186" width="100%" role="img" aria-label="Published results supporting the design">
<style>.h{font-size:9.6px;font-weight:700}.k{font-size:8.6px;fill:#52514e}.v{font-size:8.6px;font-weight:600;fill:#0b0b0b}.g{stroke:#e6e5e0}</style>
<!-- panel 1 -->
<text x="0" y="12" class="h">Page-image search wins on visual docs</text><text x="0" y="25" class="k">ViDoRe, nDCG@5 (ColPali, ICLR 2025)</text>
<g transform="translate(0,36)">
<text x="0" y="14" class="k">OCR + BM25</text><rect x="92" y="4" width="98" height="14" rx="2" fill="#86b6ef"></rect><text x="194" y="15" class="v">65.5</text>
<text x="0" y="38" class="k">Captions + BGE-M3</text><rect x="92" y="28" width="101" height="14" rx="2" fill="#86b6ef"></rect><text x="197" y="39" class="v">67.0</text>
<text x="0" y="62" class="k">ColPali (images)</text><rect x="92" y="52" width="122" height="14" rx="2" fill="#1c5cab"></rect><text x="218" y="63" class="v">81.3</text>
<line x1="92" y1="0" x2="92" y2="72" stroke="#b5b4ae"></line>
</g>
<text x="0" y="134" class="k">Scale 0–100 (bar = value × 1.5 px)</text>
<!-- panel 2 -->
<text x="262" y="12" class="h">Hybrid + rerank beats either alone</text><text x="262" y="25" class="k">Text-and-table docs, Recall@5 (arXiv 2026)</text>
<g transform="translate(262,36)">
<text x="0" y="14" class="k">Dense only</text><rect x="92" y="4" width="88" height="14" rx="2" fill="#86b6ef"></rect><text x="184" y="15" class="v">0.587</text>
<text x="0" y="38" class="k">BM25 only</text><rect x="92" y="28" width="97" height="14" rx="2" fill="#86b6ef"></rect><text x="193" y="39" class="v">0.644</text>
<text x="0" y="62" class="k">Hybrid (RRF)</text><rect x="92" y="52" width="104" height="14" rx="2" fill="#86b6ef"></rect><text x="200" y="63" class="v">0.695</text>
<text x="0" y="86" class="k">Hybrid + rerank</text><rect x="92" y="76" width="122" height="14" rx="2" fill="#1c5cab"></rect><text x="218" y="87" class="v">0.816</text>
<line x1="92" y1="0" x2="92" y2="96" stroke="#b5b4ae"></line>
</g>
<text x="262" y="146" class="k">Scale 0–1 (bar = value × 150 px)</text>
<!-- panel 3 -->
<text x="524" y="12" class="h">Version-aware search fixes revisions</text><text x="524" y="25" class="k">Version QA accuracy, % (VersionRAG, arXiv 2025)</text>
<g transform="translate(524,36)">
<text x="0" y="14" class="k">Naive RAG</text><rect x="92" y="4" width="87" height="14" rx="2" fill="#86b6ef"></rect><text x="183" y="15" class="v">58</text>
<text x="0" y="38" class="k">GraphRAG</text><rect x="92" y="28" width="96" height="14" rx="2" fill="#86b6ef"></rect><text x="192" y="39" class="v">64</text>
<text x="0" y="62" class="k">VersionRAG</text><rect x="92" y="52" width="135" height="14" rx="2" fill="#1c5cab"></rect><text x="231" y="63" class="v">90</text>
<line x1="92" y1="0" x2="92" y2="72" stroke="#b5b4ae"></line>
</g>
<text x="524" y="134" class="k">Scale 0–100 (bar = value × 1.5 px)</text>
<text x="0" y="176" class="k">Darker bar = best method in that study. Each panel is a different study and metric, so compare within a panel only. Panels 2 and 3 are preprints (not peer-reviewed).</text>
</svg>