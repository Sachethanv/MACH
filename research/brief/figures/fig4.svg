<svg viewbox="0 0 760 250" width="100%" role="img" aria-label="Edge cases by stage and risk">
<style>.k2{font-size:8.8px;fill:#52514e}.v2{font-size:8.6px;font-weight:600;fill:#0b0b0b}</style>
<!-- legend -->
<rect x="140" y="2" width="10" height="10" rx="2" fill="#d03b3b"></rect><text x="154" y="11" class="k2">High risk</text>
<rect x="214" y="2" width="10" height="10" rx="2" fill="#ec835a"></rect><text x="228" y="11" class="k2">Medium</text>
<rect x="278" y="2" width="10" height="10" rx="2" fill="#b5b4ae"></rect><text x="292" y="11" class="k2">Low</text>
<g transform="translate(0,22)" font-size="8.8">
<!-- scale: 1 case = 34px, start x=140 -->
<text x="130" y="11" class="k2" text-anchor="end">Revisions and scope</text><rect x="140" y="2" width="134" height="12" fill="#d03b3b"></rect><rect x="276" y="2" width="32" height="12" fill="#ec835a"></rect><text x="314" y="12" class="v2">5</text>
<text x="130" y="29" class="k2" text-anchor="end">Retrieval and parsing</text><rect x="140" y="20" width="236" height="12" fill="#ec835a"></rect><text x="382" y="30" class="v2">7</text>
<text x="130" y="47" class="k2" text-anchor="end">Question handling</text><rect x="140" y="38" width="168" height="12" fill="#ec835a"></rect><text x="314" y="48" class="v2">5</text>
<text x="130" y="65" class="k2" text-anchor="end">Numbers and units</text><rect x="140" y="56" width="100" height="12" fill="#d03b3b"></rect><text x="246" y="66" class="v2">3</text>
<text x="130" y="83" class="k2" text-anchor="end">Safety</text><rect x="140" y="74" width="66" height="12" fill="#d03b3b"></rect><text x="212" y="84" class="v2">2</text>
<text x="130" y="101" class="k2" text-anchor="end">Conflicts and variants</text><rect x="140" y="92" width="66" height="12" fill="#d03b3b"></rect><text x="212" y="102" class="v2">2</text>
<text x="130" y="119" class="k2" text-anchor="end">Security and access</text><rect x="140" y="110" width="66" height="12" fill="#d03b3b"></rect><rect x="208" y="110" width="32" height="12" fill="#ec835a"></rect><text x="246" y="120" class="v2">3</text>
<text x="130" y="137" class="k2" text-anchor="end">Escalation and experts</text><rect x="140" y="128" width="100" height="12" fill="#ec835a"></rect><text x="246" y="138" class="v2">3</text>
<text x="130" y="155" class="k2" text-anchor="end">Drafting</text><rect x="140" y="146" width="66" height="12" fill="#ec835a"></rect><rect x="208" y="146" width="32" height="12" fill="#b5b4ae"></rect><text x="246" y="156" class="v2">3</text>
<text x="130" y="173" class="k2" text-anchor="end">Generation</text><rect x="140" y="164" width="32" height="12" fill="#ec835a"></rect><text x="178" y="174" class="v2">1</text>
<text x="130" y="191" class="k2" text-anchor="end">Operations and audit</text><rect x="140" y="182" width="32" height="12" fill="#ec835a"></rect><rect x="174" y="182" width="66" height="12" fill="#b5b4ae"></rect><text x="246" y="192" class="v2">3</text>
<line x1="140" y1="0" x2="140" y2="198" stroke="#b5b4ae"></line>
</g>
<text x="140" y="240" class="k2">Number of edge cases per stage (37 total). Each bar segment is one risk level.</text>
<text x="450" y="60" class="k2"><tspan font-weight="700" fill="#0b0b0b">Reading it:</tspan></text>
<text x="450" y="74" class="k2">The high-risk cases sit in revisions, numbers,</text>
<text x="450" y="87" class="k2">safety, conflicts and security, which are exactly</text>
<text x="450" y="100" class="k2">the stages M.A.C.H.&#39;s novel checks target.</text>
<text x="450" y="113" class="k2">Retrieval has the most cases, but they are</text>
<text x="450" y="126" class="k2">medium risk: a miss leads to abstention, not</text>
<text x="450" y="139" class="k2">a wrong instruction.</text>
</svg>