<svg viewbox="0 0 760 120" width="100%" role="img" aria-label="Change control state machine">
<defs><marker id="b" viewbox="0 0 10 10" refx="9" refy="5" markerwidth="6" markerheight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"></path></marker></defs>
<style>.s{font-size:9.6px;font-weight:700}.t{font-size:8.3px;fill:#52514e}.l{stroke:#52514e;stroke-width:1.2;fill:none}</style>
<rect x="0" y="34" width="110" height="44" rx="22" fill="#f4f4f2" stroke="#52514e"></rect><text x="55" y="53" class="s" text-anchor="middle">AI draft</text><text x="55" y="66" class="t" text-anchor="middle">from RCA/ECN</text>
<rect x="140" y="34" width="120" height="44" rx="22" fill="#f4f4f2" stroke="#52514e"></rect><text x="200" y="53" class="s" text-anchor="middle">Compliance check</text><text x="200" y="66" class="t" text-anchor="middle">agent, automatic</text>
<rect x="290" y="34" width="120" height="44" rx="22" fill="#fdeee7" stroke="#eb6834" stroke-width="1.6"></rect><text x="350" y="53" class="s" text-anchor="middle">Human review</text><text x="350" y="66" class="t" text-anchor="middle">diff view, signed</text>
<rect x="440" y="34" width="110" height="44" rx="22" fill="#f4f4f2" stroke="#52514e"></rect><text x="495" y="53" class="s" text-anchor="middle">Approved</text><text x="495" y="66" class="t" text-anchor="middle">effective date set</text>
<rect x="580" y="34" width="180" height="44" rx="22" fill="#e3f4ec" stroke="#1baf7a"></rect><text x="670" y="53" class="s" text-anchor="middle">Effective revision</text><text x="670" y="66" class="t" text-anchor="middle">old revision → superseded</text>
<path class="l" d="M110,56 H138" marker-end="url(#b)"></path><path class="l" d="M260,56 H288" marker-end="url(#b)"></path><path class="l" d="M410,56 H438" marker-end="url(#b)"></path><path class="l" d="M550,56 H578" marker-end="url(#b)"></path>
<path class="l" d="M200,78 V102 H55 V80" marker-end="url(#b)"></path><text x="128" y="114" class="t" text-anchor="middle">fails check → back to draft</text>
<path class="l" d="M350,78 V102 H75 V80" marker-end="url(#b)" stroke-dasharray="3 2"></path><text x="290" y="114" class="t" text-anchor="middle">rejected with comments</text>
<text x="0" y="16" class="t">SOP family is locked while a draft is open, so two drafts can&#39;t collide. Every transition is logged with user and time.</text>
</svg>